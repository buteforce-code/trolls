services:
  - type: web
    name: buteforce-blog-dashboard
    runtime: node
    rootDir: blog-agent/dashboard
    buildCommand: python -m pip install -r ../requirements.txt && npm ci && npm run build
    # Write GCP credentials JSON from env var to temp file before starting
    startCommand: bash -c 'echo "$GOOGLE_CREDENTIALS_JSON" > /tmp/gcp-creds.json && npm run start'
    healthCheckPath: /
    envVars:
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_GENAI_USE_VERTEXAI
        value: "true"
      - key: GOOGLE_CLOUD_PROJECT
        value: buteforce
      - key: GOOGLE_CLOUD_LOCATION
        value: us-central1
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /tmp/gcp-creds.json
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      - key: IMAGEN_MODEL
        value: imagen-3.0-generate-001
      - key: ADK_GEMINI_MODEL
        value: gemini-2.5-flash
      - key: PYTHONUTF8
        value: "1"
      - key: TAVILY_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: APP_SECRET
        sync: false
      - key: SITE_API_URL
        value: "https://www.buteforce.com/api/agent/blog"
      - key: AGENT_SECRET_KEY
        sync: false
      - key: PUBLISH_DRY_RUN
        value: "false"
      # ── Autopilot (autonomous scheduler) ──────────────────────────────────
      # AUTOPILOT_ENABLED=false is the kill switch — pause without a redeploy.
      - key: AUTOPILOT_ENABLED
        value: "true"
      # Spacing between published posts (the cadence Google sees).
      - key: PUBLISH_GAP_HOURS
        value: "24"
      # How many finished posts to keep scheduled ahead in the veto window.
      - key: AUTOPILOT_BUFFER
        value: "1"
      # Topics the ideator generates when the queue empties.
      - key: AUTOPILOT_IDEATE_BATCH
        value: "8"
      # Hard cap on research+write work per tick, to keep each tick bounded.
      - key: AUTOPILOT_MAX_PRODUCE_PER_TICK
        value: "1"
      # Shared secret the GitHub Actions cron sends as a Bearer token. Set this to
      # the same value as the AUTOPILOT_TICK_SECRET repo secret in GitHub.
      - key: AUTOPILOT_TICK_SECRET
        sync: false
