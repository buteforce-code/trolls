services:
  - type: web
    name: buteforce-blog-dashboard
    runtime: node
    rootDir: blog-agent/dashboard
    buildCommand: python -m pip install -r ../requirements.txt && npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      # ── Dashboard auth (REQUIRED — production fails closed without these) ──
      # APP_SECRET signs the session cookie; DASHBOARD_PASSWORD is the operator
      # password. If either is missing, middleware.ts 401s every route rather
      # than reopening the dashboard.
      - key: APP_SECRET
        generateValue: true
      - key: DASHBOARD_PASSWORD
        sync: false
      # ── Spend ceilings (hard stops, checked before each agent call) ────────
      - key: MAX_RUN_COST_USD
        value: "3.00"
      - key: MAX_DAILY_COST_USD
        value: "25.00"
      - key: SWARM_TELEMETRY
        value: "true"
      # ── View-data privacy (DPDP Act / GDPR) ────────────────────────────────
      # Unset VIEW_HASH_SALT means session ids are dropped, not weakly hashed.
      - key: VIEW_HASH_SALT
        generateValue: true
      - key: VIEW_RETENTION_DAYS
        value: "90"
      # ── LLM provider (OpenAI) ──────────────────────────────────────────────
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      # ── Image generation (off by default) ──────────────────────────────────
      - key: ENABLE_IMAGES
        value: "false"
      - key: OPENAI_IMAGE_MODEL
        value: dall-e-3
      - key: OPENAI_VISION_MODEL
        value: gpt-4o
      # ── Gemini fallback (only consulted when LLM_PROVIDER=gemini) ───────────
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADK_GEMINI_MODEL
        value: gemini-2.5-flash
      - key: PYTHONUTF8
        value: "1"
      # ── Memory tuning (512MB instance is tight: Node + spawned Python share it) ──
      # Cap Node's heap so a spawned Python pipeline run has headroom before OOM.
      - key: NODE_OPTIONS
        value: "--max-old-space-size=256"
      # Limit glibc malloc arenas — large, free RSS reduction for threaded Python.
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: TAVILY_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: APP_SECRET
        sync: false
      - key: SITE_API_URL
        value: "https://www.buteforce.com/api/agent/blog"
      - key: AGENT_SECRET_KEY
        sync: false
      - key: PUBLISH_DRY_RUN
        value: "false"
      # ── Autopilot (autonomous scheduler) ──────────────────────────────────
      # AUTOPILOT_ENABLED=false is the kill switch — pause without a redeploy.
      - key: AUTOPILOT_ENABLED
        value: "true"
      # Spacing between published posts (the cadence Google sees).
      - key: PUBLISH_GAP_HOURS
        value: "24"
      # How many finished posts to keep scheduled ahead in the veto window.
      - key: AUTOPILOT_BUFFER
        value: "1"
      # Topics the ideator generates when the queue empties.
      - key: AUTOPILOT_IDEATE_BATCH
        value: "8"
      # Hard cap on research+write work per tick, to keep each tick bounded.
      - key: AUTOPILOT_MAX_PRODUCE_PER_TICK
        value: "1"
      # Shared secret the GitHub Actions cron sends as a Bearer token. Set this to
      # the same value as the AUTOPILOT_TICK_SECRET repo secret in GitHub.
      - key: AUTOPILOT_TICK_SECRET
        sync: false
